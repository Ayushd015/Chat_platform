<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #ffffff;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
        }
        #status {
            padding: 10px 20px;
            background: #f8f9fa;
            color: #666;
            text-align: center;
            font-style: italic;
            font-size: 0.9em;
        }
        #messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #fff;
            flex: 1;
        }
        .message {
            max-width: 70%;
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 10px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.self {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .message:not(.self) {
            background: #e9ecef;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }
        #message-form {
            display: flex;
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #eee;
        }
        #message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            margin-right: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        #message-input:focus {
            border-color: #667eea;
        }
        #send-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        #send-btn:hover {
            background: #5a6cd8;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 500px) {
            #chat-container {
                margin: 10px;
            }
            #messages {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">ChatConnect</div>
        <div id="status">Waiting for a chat partner...</div>
        <div id="messages"></div>
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Message bhejo..." autocomplete="off">
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let sessionId = null;

        socket.on('session', (id) => {
            sessionId = id;
            addMessage(` Session ID: ${sessionId}`, false);
        });

        socket.on('waiting', (msg) => {
            document.getElementById('status').textContent = msg;
        });

        socket.on('chat_start', (data) => {
            document.getElementById('status').textContent = `matching done ${data.partnerId}`;
        });

        socket.on('message', (data) => {
            addMessage(`${data.sender}: ${data.text}`, false);
        });

        socket.on('chat_end', (msg) => {
            document.getElementById('status').textContent = msg;
            document.getElementById('message-form').style.display = 'none';
        });

        document.getElementById('message-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('message', { text });
                addMessage(`You: ${text}`, true);
                input.value = '';
            }
        });

        function addMessage(text, isSelf) {
            const messages = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message' + (isSelf ? ' self' : '');
            msgDiv.textContent = text;
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
    <script>
        function startChatting() {
            window.location.href = 'http://localhost:3000'; 
        }
    </script>
</body>
</html>
