<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row =>
                    row.some(cell => cell !== '' && cell !== null && cell !== undefined)
                );

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatConnect</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;								
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }

        /* Landing Page Styles */
        #landing-page {
            background: linear-gradient(to bottom right, #cbd5e1, #e9d5ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .card h1 {
            font-size: 2rem;
            color: #1e3a8a;
            margin-bottom: 0.5rem;
        }
        .card p {
            color: #4b5563;
            margin-bottom: 2rem;
        }
        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .mode-button {
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        .random-button {
            background-color: #3b82f6;
            color: white;
        }
        .random-button:hover {
            background-color: #2563eb;
        }
        .filter-button {
            background-color: #8b5cf6;
            color: white;
        }
        .filter-button:hover {
            background-color: #7c3aed;
        }
        @media (min-width: 768px) {
            .card h1 {
                font-size: 2.5rem;
            }
            .card {
                padding: 3rem;
            }
        }

        /* Chat Page Styles */
        #chat-page {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: #ffffff;
            padding: 15px 20px;

        #status {

</head>
<body>
    <!-- Landing Page -->
    <div id="landing-page">
        <div class="card" id="landingCard">
            <h1 id="title">Welcome to ChatConnect</h1>
            <p>Choose your mode and get started!</p>
            <div class="mode-buttons">
                <button class="mode-button random-button" onclick="selectMode('random')">Random Connect</button>
                <button class="mode-button filter-button" onclick="selectMode('filter')">Filter Your Connection</button>
            </div>
        </div>
    </div>

    <!-- Chat Page -->
    <div id="chat-page">
        <div id="chat-container">
            <div id="header">ChatConnect</div>
            <div id="status">Waiting for a chat partner...</div>
            <div id="messages"></div>
            <form id="message-form">
                <input type="text" id="message-input" placeholder="Type Your Messages Here..." autocomplete="off">
                <button type="submit" id="send-btn">Send</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        let selectedMode = 'random';

        function selectMode(mode) {
            selectedMode = mode;
            if (mode === 'random') {
                document.getElementById('landing-page').style.display = 'none';
                document.getElementById('chat-page').style.display = 'flex';
                startChatting();
            }
        }

        function startChatting() {
            const socket = io();
            let sessionId = null;

            socket.on('session', (id) => {
                sessionId = id;
                addMessage(`Session ID: ${sessionId}`, false);
            });

            socket.on('waiting', (msg) => {
                document.getElementById('status').textContent = msg;
            });

            socket.on('chat_start', (data) => {
                document.getElementById('status').textContent = `Connected with ${data.partnerId}`;
            });

            socket.on('message', (data) => {
                addMessage(`${data.sender}: ${data.text}`, false);
            });

            socket.on('chat_end', (msg) => {
                document.getElementById('status').textContent = msg;
                document.getElementById('message-form').style.display = 'none';
            });

            document.getElementById('message-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const input = document.getElementById('message-input');
                const text = input.value.trim();
                if (text) {
                    socket.emit('message', { text });
                    addMessage(`You: ${text}`, true);
                    input.value = '';
                }
            });

            function addMessage(text, isSelf) {
                const messages = document.getElementById('messages');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message' + (isSelf ? ' self' : '');
                msgDiv.textContent = text;
                messages.appendChild(msgDiv);
                messages.scrollTop = messages.scrollHeight;
            }
        }

        // Landing page animations
        anime({
            targets: '#landingCard',
            translateY: [100, 0],
            opacity: [0, 1],
            duration: 1500,
            easing: 'easeOutExpo'
        });

        anime({
            targets: '#title',
            scale: [0.8, 1],
            opacity: [0, 1],
            delay: 500,
            duration: 1000,
            easing: 'easeOutElastic(1, .6)'
        });
    </script>
</body>
</html>
